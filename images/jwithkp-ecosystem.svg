<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" aria-label="JWithKP Ecosystem Diagram">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .connection-line { stroke: url(#hubGradient); stroke-width: 2; stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
    .pulse-ring { animation: ringPulse 3s ease-out infinite; transform-origin: center; }
    .orbit-node { animation: nodeFloat 4s ease-in-out infinite alternate; }
    .hub-rotate { animation: hubSpin 20s linear infinite; transform-origin: 400px 230px; }

    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodeFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes ringPulse {
      0% { r: 50px; opacity: 0.8; }
      100% { r: 90px; opacity: 0; }
    }
    @keyframes hubSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Dark Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Tech Grid Background -->
  <g class="bg-grid">
    <path d="M 0,50 H 800 M 0,100 H 800 M 0,150 H 800 M 0,200 H 800 M 0,250 H 800 M 0,300 H 800 M 0,350 H 800 M 0,400 H 800 M 0,450 H 800" />
    <path d="M 50,0 V 500 M 100,0 V 500 M 150,0 V 500 M 200,0 V 500 M 250,0 V 500 M 300,0 V 500 M 350,0 V 500 M 400,0 V 500 M 450,0 V 500 M 500,0 V 500 M 550,0 V 500 M 600,0 V 500 M 650,0 V 500 M 700,0 V 500 M 750,0 V 500" />
  </g>

  <!-- Outer Hub Glow -->
  <circle cx="400" cy="230" r="140" fill="url(#hubGlow)" />

  <!-- Connection Lines to Nodes -->
  <line x1="400" y1="230" x2="400" y2="80" class="connection-line" />
  <line x1="400" y1="230" x2="620" y2="130" class="connection-line" />
  <line x1="400" y1="230" x2="600" y2="340" class="connection-line" />
  <line x1="400" y1="230" x2="200" y2="340" class="connection-line" />
  <line x1="400" y1="230" x2="180" y2="130" class="connection-line" />

  <!-- Orbit Rings around Hub -->
  <circle cx="400" cy="230" r="60" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="400" cy="230" r="75" class="pulse-ring" fill="none" stroke="#06b6d4" stroke-width="1.5" />

  <!-- Central Rotational Ring -->
  <g class="hub-rotate">
    <circle cx="400" cy="230" r="85" fill="none" stroke="url(#hubGradient)" stroke-width="2" stroke-dasharray="20 40" />
  </g>

  <!-- CENTRAL HUB (JWithKP Core) -->
  <g filter="url(#glow)">
    <circle cx="400" cy="230" r="50" fill="url(#hubGradient)" />
  </g>
  <!-- Central Shield / "J" Icon -->
  <path d="M 400,202 L 422,212 V 232 C 422,246 412,256 400,260 C 388,256 378,246 378,232 V 212 Z" fill="#ffffff" opacity="0.95" />
  <text x="400" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#2563eb" text-anchor="middle">J</text>

  <!-- ORBITING TECHNOLOGY NODES -->

  <!-- NODE 1: Proxmox VE (Top) -->
  <g class="orbit-node" style="animation-delay: 0s;">
    <circle cx="400" cy="80" r="34" fill="url(#nodeGradient)" stroke="#2563eb" stroke-width="2" filter="url(#glow)" />
    <path d="M 388,70 H 412 V 76 H 388 Z M 388,78 H 412 V 84 H 388 Z M 388,86 H 412 V 92 H 388 Z" fill="#38bdf8" />
    <circle cx="393" cy="73" r="1.5" fill="#10b981" />
    <circle cx="393" cy="81" r="1.5" fill="#10b981" />
    <circle cx="393" cy="89" r="1.5" fill="#10b981" />
    <text x="400" y="128" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">Proxmox VE</text>
    <text x="400" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Virtualization</text>
  </g>

  <!-- NODE 2: Wazuh SIEM (Top Right) -->
  <g class="orbit-node" style="animation-delay: 0.8s;">
    <circle cx="620" cy="130" r="34" fill="url(#nodeGradient)" stroke="#7c3aed" stroke-width="2" filter="url(#glow)" />
    <path d="M 620,116 L 633,123 V 135 C 633,143 626,149 620,152 C 614,149 607,143 607,135 V 123 Z" fill="none" stroke="#a78bfa" stroke-width="2" />
    <path d="M 616,133 L 619,136 L 625,128" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <text x="620" y="178" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">Wazuh SIEM</text>
    <text x="620" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">SOC &amp; Security</text>
  </g>

  <!-- NODE 3: pfSense Firewall (Bottom Right) -->
  <g class="orbit-node" style="animation-delay: 1.6s;">
    <circle cx="600" cy="340" r="34" fill="url(#nodeGradient)" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
    <path d="M 588,330 H 612 V 350 H 588 Z M 588,340 H 612 M 600,330 V 350" fill="none" stroke="#22d3ee" stroke-width="2" />
    <text x="600" y="388" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">pfSense</text>
    <text x="600" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Enterprise Firewall</text>
  </g>

  <!-- NODE 4: Nextcloud Storage (Bottom Left) -->
  <g class="orbit-node" style="animation-delay: 2.4s;">
    <circle cx="200" cy="340" r="34" fill="url(#nodeGradient)" stroke="#2563eb" stroke-width="2" filter="url(#glow)" />
    <path d="M 190,345 A 8,8 0 0,1 190,332 A 12,12 0 0,1 210,330 A 10,10 0 0,1 214,345 Z" fill="none" stroke="#60a5fa" stroke-width="2" />
    <text x="200" y="388" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">Nextcloud</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Private Cloud</text>
  </g>

  <!-- NODE 5: HRMS SaaS (Top Left) -->
  <g class="orbit-node" style="animation-delay: 3.2s;">
    <circle cx="180" cy="130" r="34" fill="url(#nodeGradient)" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <circle cx="180" cy="123" r="6" fill="none" stroke="#34d399" stroke-width="2" />
    <path d="M 168,140 C 168,133 173,131 180,131 C 187,131 192,133 192,140" fill="none" stroke="#34d399" stroke-width="2" />
    <text x="180" y="178" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">HRMS SaaS</text>
    <text x="180" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Payroll &amp; Compliance</text>
  </g>

  <!-- BOTTOM TITLE & TAGLINE -->
  <text x="400" y="445" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="1">JWithKP</text>
  <text x="400" y="465" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">Enterprise Infrastructure • Security • Innovation</text>
</svg>
